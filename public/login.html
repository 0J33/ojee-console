<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="cyan">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark light">
<title>sign in · ojee.console</title>
<script>try{var t=localStorage.getItem('ojee.theme')||'dark';if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/ojee-ui3.css">
<link rel="stylesheet" href="/app.css">
</head>
<body class="login-body ui3-root">
<main class="login">
  <div class="wm" id="logo">ojee<b>.</b><span>console</span></div>
  <div class="panel">
    <h1>Sign in</h1>
    <p class="lead" id="note">You are on the tailnet<span id="peer-wrap"> as <b id="peer"></b></span>. Enter the six-digit code from your authenticator.</p>
    <form id="form" autocomplete="off" novalidate>
      <div class="field">
        <label for="code" class="sr-only">Authenticator code</label>
        <!-- inputmode=numeric + autocomplete=one-time-code: iOS offers the
             code from Messages, Android autofills it, and the digit keypad
             comes up instead of the keyboard. -->
        <input class="input code" id="code" name="code" type="text"
               inputmode="numeric" pattern="[0-9]*" maxlength="6"
               autocomplete="one-time-code" enterkeyhint="go"
               aria-describedby="err" placeholder="000000" required>
        <span class="err" id="err" role="alert" hidden></span>
      </div>
      <label class="check"><input type="checkbox" id="trust" checked><span>Trust this device for <b id="trust-days">30</b> days</span></label>
      <button class="btn pri lg block" id="submit" type="submit">Sign in</button>
    </form>
  </div>
  <div class="gates m"><span>tailscale</span><span>·</span><span>totp</span><span>·</span><span>device trust</span></div>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module">
const $ = (s) => document.querySelector(s);
const err = $('#err');
const code = $('#code');

// Branding is public within the tailnet — the gate already ran, so anyone
// who can load this page is an authenticated peer.
fetch('/api/branding').then((r) => r.json()).then((b) => {
  const esc = (x) => String(x ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  document.title = `sign in · ${b.wordmark}${b.wordmarkAccent}${b.wordmarkTail}`;
  $('#logo').innerHTML = `${esc(b.wordmark)}<b>${esc(b.wordmarkAccent)}</b><span>${esc(b.wordmarkTail)}</span>`;
  if (b.peer) $('#peer').textContent = b.peer; else $('#peer-wrap').hidden = true;
}).catch(() => { $('#peer-wrap').hidden = true; });

const show = (msg) => { err.textContent = msg; err.hidden = false; code.setAttribute('aria-invalid', 'true'); };
const clear = () => { err.hidden = true; code.removeAttribute('aria-invalid'); };

// Strip anything non-numeric as it is typed — pasting "123 456" from a
// password manager is the common case, and rejecting it as malformed would
// be an own goal.
code.addEventListener('input', () => {
  const cleaned = code.value.replace(/\D/g, '').slice(0, 6);
  if (cleaned !== code.value) code.value = cleaned;
  clear();
  // Six digits is unambiguous — submit rather than making them reach for a
  // button they cannot see under the keypad.
  if (cleaned.length === 6) $('#form').requestSubmit();
});

const MESSAGES = {
  malformed: 'That is not a six-digit code.',
  invalid: 'Incorrect code. Check your authenticator and try the next one.',
  replayed: 'That code was already used. Wait for the next one.',
  rate_limited: 'Too many attempts. Wait a minute and try again.',
};

$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#submit');
  if (btn.disabled) return;
  btn.disabled = true;
  btn.textContent = 'Checking…';
  clear();

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        code: code.value,
        trustDevice: $('#trust').checked,
        deviceLabel: '',
      }),
    });
    const body = await res.json().catch(() => ({}));

    if (res.ok) {
      btn.textContent = 'Signed in';
      location.href = '/';
      return;
    }

    show(MESSAGES[body.error] || `Sign-in failed (${body.error || res.status}).`);
    code.value = '';
    code.focus();
  } catch {
    show('Could not reach the console. Is Tailscale still connected?');
  } finally {
    if (btn.textContent !== 'Signed in') {
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  }
});

code.focus();
</script>
</body>
</html>
