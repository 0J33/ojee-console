<!-- The movement. One canvas for the whole console, behind everything,
     bound to the boxes the layout puts on the page. Decorative to a screen
     reader: everything it draws is stated in text beside it. -->
<div class="mv-host" id="mv" aria-hidden="true"></div>

<a class="skip" href="#main">Skip to content</a>

<div class="hudbar" id="hudbar">
  <span class="seg seg--accent seg--live"><b id="hud-state">booting</b></span>
  <span class="seg hide-sm">user <b id="hud-user">—</b></span>
  <span class="seg">modules <b id="hud-modules">–</b></span>
  <span class="seg right">local <b id="hud-clock">--:--:--</b></span>
</div>

    <kbd class="kbd">/</kbd>
  </button>

<!-- Mobile only: the ACTIVE module's views. The bottom tab bar switches
     MODULES, so without this strip a module's other views are unreachable
     on a phone. -->
<div class="viewstrip" id="viewstrip" role="tablist" aria-label="Views"></div>

<div class="shell">
  <!-- Desktop only: every module and its views, always visible. The old nav
       showed the active module's views and nothing else, so switching module
       meant going back to the launcher or opening the palette. -->
  <aside class="sidenav" id="sidenav" aria-label="Modules and views"></aside>

  <main class="wrap" id="main">
    <!-- The active module's own object, its headline, and the crown. Owned by
         the shell so it survives every module mount. -->
    <div class="modhead" id="modhead" hidden></div>
    <div id="view"></div>
  </main>
</div>

<nav class="tabbar" id="tabbar" aria-label="Modules"></nav>

<div class="statusbar">
  <span class="ok" id="sb-conn">connecting</span>
  <span class="hide-sm" id="sb-note"></span>
  <span class="right"><a href="#/settings">settings</a></span>
</div>

<div id="modal-root"></div>
<div class="toast-stack" id="toasts" aria-live="polite" aria-atomic="false"></div>
