<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08080e">
<meta name="description" content="Tailnet-only control console.">
<title>console</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;700;900&family=Major+Mono+Display&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Departure Mono';
  src: url('https://cdn.jsdelivr.net/gh/rektdeckard/departure-mono@main/public/assets/DepartureMono-Regular.woff2') format('woff2');
  font-display: swap;
}
</style>

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="/ojee-ui.css">
<!-- Branding theme overlay; src set at runtime from config. -->
<link id="theme-link" rel="stylesheet" href="">
<link rel="stylesheet" href="/app.css">
</head>
<body class="app grid-bg">

<!--
  Shell icon sprite. Modules reference these ids through ctx.icon(), and may
  append their own <symbol>s to this sprite on mount — one stroke language
  across the whole console rather than a different icon set per module.
-->
<svg class="sprite" id="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-grid" viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></symbol>
  <symbol id="i-ac" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="8"/><path d="M5.5 9h13M7 16.5c1.6 0 1.6 2 3.2 2M13.8 16.5c1.6 0 1.6 2 3.2 2"/></symbol><symbol id="i-scene" viewBox="0 0 24 24"><path d="M4 7h4M12 7h8M4 12h10M18 12h2M4 17h2M10 17h10"/><path d="M10 5v4M16 10v4M8 15v4"/></symbol><symbol id="i-auto" viewBox="0 0 24 24"><path d="M2.5 8h6M2.5 16h6M21.5 8h-4.5M21.5 16h-4.5"/><rect x="8.5" y="4.5" width="7" height="15"/><path d="M11 9.5l2.5 2.5L11 14.5"/></symbol><symbol id="i-temp" viewBox="0 0 24 24"><path d="M12 3.5v9.5"/><circle cx="12" cy="16.5" r="3.5"/><path d="M14.5 6h2M14.5 9.5h2"/></symbol><symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6"/><rect x="3" y="14" width="18" height="6"/><path d="M6.5 7h.01M6.5 17h.01"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></symbol><symbol id="i-cog" viewBox="0 0 24 24"><path d="M10.71 5.94 L10.09 3.00 L13.91 3.00 L13.29 5.94 L15.38 6.80 L17.01 4.28 L19.72 6.99 L17.20 8.62 L18.06 10.71 L21.00 10.09 L21.00 13.91 L18.06 13.29 L17.20 15.38 L19.72 17.01 L17.01 19.72 L15.38 17.20 L13.29 18.06 L13.91 21.00 L10.09 21.00 L10.71 18.06 L8.62 17.20 L6.99 19.72 L4.28 17.01 L6.80 15.38 L5.94 13.29 L3.00 13.91 L3.00 10.09 L5.94 10.71 L6.80 8.62 L4.28 6.99 L6.99 4.28 L8.62 6.80 Z"/><circle cx="12" cy="12" r="2.6"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3zM12 9v5M12 17h.01"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/></symbol>
  <symbol id="i-log" viewBox="0 0 24 24"><path d="M4 4h16M4 9h16M4 14h10M4 19h7"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9M7.5 6.2a7.5 7.5 0 1 0 9 0"/></symbol>
  <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4 18a8 8 0 1 1 16 0M12 18l4-5"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><path d="M3 4h18v12H3zM8 20h8M12 16v4"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-1.5 5.5M20 5v6h-6"/></symbol>
</svg>

<a class="skip" href="#main">Skip to content</a>

<div class="hudbar" id="hudbar">
  <span class="seg seg--accent seg--live"><b id="hud-state">booting</b></span>
  <span class="seg hide-sm">user <b id="hud-user">—</b></span>
  <span class="seg">modules <b id="hud-modules">–</b></span>
  <span class="seg right">local <b id="hud-clock">--:--:--</b></span>
</div>

<nav class="nav" aria-label="Primary">
  <a class="nav-logo" id="nav-logo" href="#/">console</a>
  <div class="nav-links" id="nav-links"></div>
  <button class="nav-jump" id="nav-jump" type="button"
          aria-label="Jump to (press slash)" title="Jump to  /">
    <svg class="ic" aria-hidden="true"><use href="#i-search"></use></svg>
    <span>Jump</span>
    <kbd class="kbd">/</kbd>
  </button>
  <a class="nav-settings iconbtn" href="#/settings" aria-label="Settings" title="Settings">
    <svg class="ic" aria-hidden="true"><use href="#i-cog"></use></svg>
  </a>
</nav>

<!-- Mobile only: the ACTIVE module's views. The bottom tab bar switches
     MODULES, so without this strip a module's other views are unreachable
     on a phone. -->
<div class="viewstrip" id="viewstrip" role="tablist" aria-label="Views"></div>

<main class="wrap" id="main">
  <div id="view"></div>
</main>

<nav class="tabbar" id="tabbar" aria-label="Modules"></nav>

<div class="statusbar">
  <span class="ok" id="sb-conn">connecting</span>
  <span class="hide-sm" id="sb-note"></span>
  <span class="right"><a href="#/settings">settings</a></span>
</div>

<div id="modal-root"></div>
<div class="toast-stack" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
