<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08080e">
<meta name="description" content="Tailnet-only control console.">
<title>console</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;700;900&family=Major+Mono+Display&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Departure Mono';
  src: url('https://cdn.jsdelivr.net/gh/rektdeckard/departure-mono@main/public/assets/DepartureMono-Regular.woff2') format('woff2');
  font-display: swap;
}
</style>

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="/ojee-ui.css">
<!-- Branding theme overlay; src set at runtime from config. -->
<link id="theme-link" rel="stylesheet" href="">
<link rel="stylesheet" href="/app.css">
</head>
<body class="app grid-bg">

<!--
  Shell icon sprite. Modules reference these ids through ctx.icon(), and may
  append their own <symbol>s to this sprite on mount — one stroke language
  across the whole console rather than a different icon set per module.
-->
<svg class="sprite" id="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-grid" viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></symbol>
  <symbol id="i-cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3zM12 9v5M12 17h.01"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/></symbol>
  <symbol id="i-log" viewBox="0 0 24 24"><path d="M4 4h16M4 9h16M4 14h10M4 19h7"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9M7.5 6.2a7.5 7.5 0 1 0 9 0"/></symbol>
  <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4 18a8 8 0 1 1 16 0M12 18l4-5"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><path d="M3 4h18v12H3zM8 20h8M12 16v4"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-1.5 5.5M20 5v6h-6"/></symbol>
</svg>

<a class="skip" href="#main">Skip to content</a>

<div class="hudbar" id="hudbar">
  <span class="seg seg--accent seg--live"><b id="hud-state">booting</b></span>
  <span class="seg hide-sm">user <b id="hud-user">—</b></span>
  <span class="seg">modules <b id="hud-modules">–</b></span>
  <span class="seg right">local <b id="hud-clock">--:--:--</b></span>
</div>

<nav class="nav" aria-label="Primary">
  <a class="nav-logo" id="nav-logo" href="#/">console</a>
  <div class="nav-links" id="nav-links"></div>
  <a class="nav-settings iconbtn" href="#/settings" aria-label="Settings" title="Settings">
    <svg class="ic" aria-hidden="true"><use href="#i-cog"></use></svg>
  </a>
</nav>

<main class="wrap" id="main">
  <div id="view"></div>
</main>

<nav class="tabbar" id="tabbar" aria-label="Modules"></nav>

<div class="statusbar">
  <span class="ok" id="sb-conn">connecting</span>
  <span class="hide-sm" id="sb-note"></span>
  <span class="right"><a href="#/settings">settings</a></span>
</div>

<div id="modal-root"></div>
<div class="toast-stack" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
