<div class="app" id="app">
  <aside class="rail" aria-label="Console">
    <a class="brand" href="#now" aria-label="ojee.console, now">
      <span class="brand-plate" aria-hidden="true"></span>
      <span class="wordmark">ojee<b>.</b>console</span>
    </a>
    <button class="ask" type="button" data-act="ask"><svg class="ic"><use href="#i-chat"/></svg><span>Ask Odysseus</span><kbd>A</kbd></button>
    <nav class="nav" id="railnav"></nav>
    <div class="rail-foot">
      <div class="player" id="railplayer"></div>
      <p class="rail-note">Sample data. Nothing here is live.</p>
    </div>
  </aside>

  <main class="main" id="main" tabindex="-1"></main>

  <div class="dock" id="dock">
    <div class="miniplayer" id="miniplayer"></div>
    <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1" hidden>
  <div class="sheet-grab" id="sheetgrab" aria-hidden="true"><span></span></div>
  <div class="sheet-body" id="sheetbody"></div>
</section>

<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Jump" hidden>
  <div class="palette-card">
    <label class="palette-field"><svg class="ic"><use href="#i-search"/></svg><input id="palette-q" type="text" placeholder="Jump to a page, a machine or an action" autocomplete="off"><kbd>esc</kbd></label>
    <ul class="palette-list" id="palette-list" role="listbox"></ul>
  </div>
</div>

<div class="idle" id="idle" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<canvas class="stage" id="stage" aria-hidden="true"></canvas>
